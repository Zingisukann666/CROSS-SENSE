        </select>

        <select id="attributeFilter" onchange="searchCards()">

            <option value="陸">陸</option>
            <option value="海">海</option>

        // カードを表示する
        function displayCards(cardData) {

            const cardList =
                document.getElementById("cardList");

            // 一度画面を空にする
            cardList.innerHTML = "";


            // 検索結果がない場合
            if (cardData.length === 0) {

                cardList.innerHTML =
                    "<p>該当するカードがありません。</p>";

                return;
            }


            // カードを1枚ずつ表示
            cardData.forEach(function(card) {

                const cardElement =
                    document.createElement("div");


                // カード画像だけ表示する
                cardElement.innerHTML = `
                    <img
                        src="${card.image}"
                        width="250"
                    >
                `;


                cardList.appendChild(cardElement);

            });

        }


        // 検索
        function searchCards() {

            // カード名
            const keyword =
                document.getElementById("searchBox").value;


            // 効果名
            const effectKeyword =
                document.getElementById("effectSearchBox").value;


            // カード種類
            const type =
                document.getElementById("typeFilter").value;


            // バトルタイプ
            const battleType =
                document.getElementById("battleTypeFilter").value;


            // 属性
            const attribute =
                document.getElementById("attributeFilter").value;


            // 条件に合うカードを探す
            const results = cards.filter(function(card) {

                // カード名
                const nameMatch =
                    card.name.includes(keyword);


                // 効果名
                const effectMatch =
                    card.effect.includes(effectKeyword);


                // カード種類
                const typeMatch =
                    type === "all" ||
                    card.type === type;


                // バトルタイプ
                const battleTypeMatch =
                    battleType === "all" ||
                    card.battleType === battleType;


                // 属性
                const attributeMatch =
                    attribute === "all" ||
                    card.attribute === attribute;


                // 全部の条件を満たしたカードだけ残す
                return (
                    nameMatch &&
                    effectMatch &&
                    typeMatch &&
                    battleTypeMatch &&
                    attributeMatch
                );

            });


            // 結果を表示
            displayCards(results);

        }


        // 最初は全部表示
        displayCards(cards);
